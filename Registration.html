<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
</head>

<body>
    
    <form>

        <label for="name">Имя:</label>
        <input type="text" name="name" id="name"><br><br>

        <label for="email">Почта:</label>
        <input type="email" name="email" id="email"><br><br>

        <label for="password">Пароль:</label>
        <input type="password" minlength="5" required placeholder="Ваш пароль" name="password" id="password"><br><br>

       <h2>Пол</h2>

       <label for="m">Мужской</label>
       <input type="radio" id="m" name="gender" value="m">

       <label for="f">Женский</label>
       <input type="radio" name="gender" id="f" value="f"><br><br>

       <h2>Выберите любимые ЯП:</h2>
 
       <input type="checkbox" id="python" name="languageProgramming" value="Python">
       <label for="python">Python</label><br>

       <input type="checkbox" id="c#" name="languageProgramming" value="C#">
       <label for="c#">C#</label> <br>

       <input type="checkbox" id="javaScript" name="languageProgramming" value="JavaScript">
       <label for="javaScript">JavaScript</label> <br><br>

       <h2>Город</h2>
       
       <select name="city">
         <option value="vdk">Владивосток</option>
         <option value="omsk">Омск</option>
         <option value="msk">Москва</option>
       </select><br><br>

       <h2>ДОП</h2>
       <textarea name="additionally" rows="4" cols="40" placeholder="Дополнительно"></textarea>

       <input type="submit" name="registration" id="registration"> 
       <input type="reset" name="reset" id="reset">






       
       


    
    </form>

</body>
</html>
