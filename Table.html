<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таблицы</title>
</head>
<body>
    <table border="1" >

        <caption>Мой бюджет</caption>
        <thead>
            <tr>
                <th>Расход</th>
                <th>Сумма</th>
                <th>Комментарий</th>
            </tr>
        </thead>

        <tbody>
            
            <tr>
                <th>5000</th>
                <th>1000</th>
                <th>Осталось</th>
            </tr>

             <tr>
                <th>2000</th>
                <th>200</th>
                <th>Осталось</th>
            </tr>

             <tr>
                <th>1000</th>
                <th>800</th>
                <th>Осталось</th>
            </tr>

             <tr>
                <th colspan="2">Итого</th>
                <th>2000</th>
            </tr>

        </tbody>

    </table>
</body>
</html>
